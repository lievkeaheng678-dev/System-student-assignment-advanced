{% if field.field.widget.input_type == "checkbox" %}
  <div class="field field-check{% if field.errors %} has-error{% endif %}">
    <label class="check-row" for="{{ field.id_for_label }}">
      {{ field }}
      <span>{{ field.label }}</span>
    </label>
    {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
  </div>
{% else %}
  <div class="field{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div class="hint">{{ field.help_text|safe }}</div>{% endif %}
    {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
  </div>
{% endif %}
