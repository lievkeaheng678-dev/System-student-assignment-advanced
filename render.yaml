# Render Blueprint: one web service + one free PostgreSQL database.
# Dashboard -> New -> Blueprint -> pick this repository -> Apply.

databases:
  - name: student-portal-db
    plan: free
    databaseName: student_portal
    user: student_portal

services:
  - type: web
    name: student-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py render_setup
    startCommand: gunicorn config.wsgi:application --access-logfile -
    healthCheckPath: /healthz/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-portal-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: SITE_NAME
        value: Student Portal

      # Public demo helpers. Set both to "false" for a real deployment.
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DEMO
        value: "true"

      # Admin login for /admin/. Render asks you for the email when you apply
      # the Blueprint; the password is generated and shown in the Environment tab.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
